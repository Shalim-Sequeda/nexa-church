[package]
name = "nexa_church"
version = "1.0.0"
description = "NEXA — Church Presentation System"
authors = ["SHALIM TECHNOLOGIES"]
edition = "2021"

[lib]
name = "nexa_church_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
dirs = "5.0"
lofty = "0.21"
glob = "0.3"
base64 = "0.22"
tiny_http = "0.12"
